<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}

/* Layout: one-screen app. Header + ticker + room tabs on top, isometric office canvas with a side panel, office log along the bottom.
   Single committed look: a cozy evening control room (dark chrome), the canvas scene itself switches day/night by Jakarta time. */
:root{
  --bg:#191d2b;        /* ink blue, the room behind the office */
  --surface:#232a3d;   /* panels */
  --surface-2:#2c3550; /* raised rows, inputs */
  --line:#3a4463;
  --fg:#ece6d8;        /* warm paper text */
  --muted:#a4a9bd;
  --accent:#f0b44c;    /* desk-lamp amber */
  --accent-ink:#2a1d05;
  --teal:#63c7b2;
  --ok:#6fcf8e;
  --bad:#ef6b57;
  --warn:#f3d25b;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;background:var(--accent);display:inline-block;box-shadow:4px 4px 0 var(--teal)}
.top .spacer{flex:1}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.chip.mode{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}
.ctrl{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px}
.ctrl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

/* ticker */
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--surface);border-radius:4px;flex:none}
.ticker-track{display:flex;gap:28px;width:max-content;padding:7px 0;animation:tick 48s linear infinite;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ticker-track span{white-space:nowrap}
.ticker-track b{font-weight:500;color:var(--fg)}
.ticker-track .lbl{color:var(--muted)}
.dn{color:var(--bad)} .up{color:var(--ok)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 11px;font-family:var(--f-display);font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--surface)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.tab .badge{position:absolute;top:-6px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:11px;line-height:18px;text-align:center}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}
.floor-wrap{position:relative;min-width:0;min-height:0;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#141826}
canvas#floor{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#floor.dragging{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:4px 8px;border-radius:4px;pointer-events:none}

/* panel */
.panel{min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.panel h3{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0}
.panel .close{display:none}
.who{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:4px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#1b1b1b}
.who p{margin:2px 0 0;color:var(--muted);font-size:13px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--f-mono);padding:3px 8px;border-radius:4px;background:var(--surface-2)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state.working::before{background:var(--ok)}
.state.waiting_approval::before{background:var(--warn)}
.state.alert::before{background:var(--bad)}
.state.meeting::before{background:var(--teal)}
.state.idle::before{background:var(--muted)}
.bubble-now{background:var(--fg);color:#22232b;border-radius:6px;padding:8px 10px;font-size:13.5px;line-height:1.4}
.sec{display:flex;flex-direction:column;gap:8px}
.md{font-size:13.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow-x:auto}
.md h4{font-family:var(--f-display);font-size:15px;margin:2px 0 6px}
.md h5{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.md ul{margin:0;padding-left:18px}
.md p{margin:4px 0}
.md table{border-collapse:collapse;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;margin:4px 0}
.md td,.md th{border-bottom:1px solid var(--line);padding:3px 8px 3px 0;text-align:left;white-space:nowrap}
.msgs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.msgs li{background:var(--surface-2);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.45}
.msgs .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.msgs strong{display:block;margin:2px 0}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hist time{font-family:var(--f-mono);color:var(--fg);margin-right:6px}

/* approval card */
.apv{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.apv.pending{border-color:var(--warn)}
.apv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2)}
.pair{font-family:var(--f-display);font-size:18px;font-weight:700}
.side{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 7px;border-radius:3px}
.side.long{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.side.short{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.pill{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:3px;font-family:var(--f-mono)}
.pill.pending{background:var(--warn);color:#2a2305}
.pill.approved{background:var(--ok);color:#0c2414}
.pill.rejected{background:var(--bad);color:#2b0b06}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);margin:0}
.kv div{background:var(--bg);padding:8px 10px;min-width:0}
.kv dt{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.why{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
.why p{margin:0}
.edit{padding:0 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field select,.field textarea{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px}
.field.wide{grid-column:1/-1}
.actions{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.btn{border-radius:4px;padding:8px 12px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#0c2414}
.btn.no{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fine{font-size:12px;color:var(--muted);margin:0;padding:0 12px 12px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.link{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* log */
.log{flex:none;height:118px;display:flex;flex-direction:column;gap:6px;min-height:0}
.log h2{font-family:var(--f-display);font-size:14px;margin:0;color:var(--muted);font-weight:500}
.log ol{list-style:none;margin:0;padding:8px 10px;overflow-y:auto;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log li{display:flex;gap:10px;min-width:0}
.log time{font-family:var(--f-mono);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log .who-to{color:var(--accent);flex:none}
.log .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;max-width:min(360px,calc(100vw - 32px));background:var(--warn);color:#2a2305;padding:10px 14px;border-radius:6px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:72%;z-index:15;border-radius:10px 10px 0 0;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .25s ease}
  .panel.open{transform:none}
  .panel .close{display:block;align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px}
  .log{height:96px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .chip.clock{display:none}
}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}.panel{transition:none}}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Trading Floor</div>
    <span class="chip mode" title="Semua order hanya simulasi sampai kamu bilang live">PAPER · data contoh</span>
    <span class="chip clock" id="clock">--:-- WIB</span>
    <span class="spacer"></span>
    <button class="ctrl" id="demoBtn" aria-pressed="true">Demo jalan</button>
    <button class="ctrl" id="nightBtn">Lampu: auto</button>
  </header>

  <div class="ticker" aria-label="Ticker pasar"><div class="ticker-track" id="ticker"></div></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Ruangan"></nav>

  <main class="stage">
    <div class="floor-wrap" id="floorWrap">
      <canvas id="floor" tabindex="0" aria-label="Kantor isometrik. Klik karakter untuk membuka catatannya."></canvas>
      <div class="hint">Klik karakter untuk lihat catatan · geser untuk pindah</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="log" aria-label="Log kantor">
    <h2>Log Kantor</h2>
    <ol id="log"></ol>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ------------------------------------------------------------------
   DATA LAYER
   Shapes mirror the files the Next.js version will read from ./office:
   agents/<id>/status.json, CATATAN-<NAMA>.md, inbox/<id>/*.json,
   approvals/*.json, market/snapshot.json. In this prototype they live
   in memory; later, replace `store` updates with the SSE feed.
------------------------------------------------------------------- */

    asOf: "23 Okt 2026 17:26 WIB",
    prices: [

      { pair: "XRPUSDT", last: 1.32, chg: -0.74, dp: 4 },

    fundingBtc: 0.010,
    equity: EQUITY,
    pnlToday: 0,
    openPositions: [],
  },
  agents: [],
  messages: [],
  approvals: [],
  log: [],
};

const ROOMS = [
  { id: "lobby",   name: "Lobby",          x0: 0,  x1: 8,  y0: 0, y1: 7,  floor: "#d2bd95" },

const AGENT_DEFS = [

const CATATAN = {

## Mode

const DESK_SPOTS = { lobbyBoard: true };
const IDLE_SPOTS = [[17,11],[18,12],[22,10],[22,12],[17,13],[20,9]];
const MEETING_SEATS = [[2,9],[3,9],[4,9],[5,9],[2,12],[3,12],[4,12],[5,12]];

/* ------------------------------------------------------------------ helpers */
let currentRoom = "lobby", selected = null, panelMode = "approval", editing = false;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n, dp = 2) => Number(n).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const jktFmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", hour12: false });
const nowHM = () => jktFmt.format(new Date());
const jktHour = () => Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", hour12: false }).format(new Date()));
const agentById = id => store.agents.find(a => a.id === id);
const roomOf = (gx, gy) => ROOMS.find(r => gx >= r.x0 && gx < r.x1 && gy >= r.y0 && gy < r.y1);

/* ------------------------------------------------------------------ approvals */
function calcApproval(a) {
  const stopPct = Math.abs(a.entry - a.sl) / a.entry;
  const riskUsd = store.market.equity * a.riskPct / 100;
  const notional = riskUsd / stopPct;
  return {
    riskUsd, notional,
    qty: notional / a.entry,
    margin: notional / a.leverage,
    rr: Math.abs(a.tp - a.entry) / Math.abs(a.entry - a.sl),
    stopPct: stopPct * 100,
    tpPct: Math.abs(a.tp - a.entry) / a.entry * 100,
  };
}
store.approvals.push({
  id: "apv-001", from: "raka", type: "entry", pair: "BTCUSDT", side: "long",
  entry: 81700, sl: 80880, tp: 83340, riskPct: 1, leverage: 2, status: "pending",
  alasan: "Pullback ke zona 81.6k–81.8k, harga masih di atas EMA200 4H, funding netral. Setup contoh untuk menguji alur approval.",
  catatanRisk: "Lolos aturan: risk 1%, R:R 1:2, leverage di bawah 5x. Notional di bawah $100, jadi cek minimum order exchange sebelum live.",

/* ------------------------------------------------------------------ grid / pathfinding */
const blocked = new Set();
const key = (x, y) => x + "," + y;
const doors = new Set();
function addDoor(a, b) { doors.add(key(...a) + "|" + key(...b)); doors.add(key(...b) + "|" + key(...a)); }
[8, 16, 23].forEach(bx => { addDoor([bx - 1, 3], [bx, 3]); addDoor([bx - 1, 11], [bx, 11]); });
[4, 12, 19, 26].forEach(dx => addDoor([dx, 6], [dx, 7]));

function canStep(ax, ay, bx, by) {
  if (bx < 0 || by < 0 || bx >= GW || by >= GH) return false;
  if (blocked.has(key(bx, by))) return false;
  const ra = roomOf(ax, ay), rb = roomOf(bx, by);
  if (ra !== rb) return doors.has(key(ax, ay) + "|" + key(bx, by));
  return true;
}
function findPath(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Map([[key(sx, sy), null]]);
  const q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k)) continue;
      if (!(nx === tx && ny === ty) && !canStep(x, y, nx, ny)) continue;
      if (nx === tx && ny === ty && roomOf(x, y) !== roomOf(nx, ny) && !doors.has(key(x, y) + "|" + k)) continue;
      prev.set(k, [x, y]); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return [];
  const path = []; let cur = [tx, ty];
  while (cur && !(cur[0] === sx && cur[1] === sy)) { path.unshift(cur); cur = prev.get(key(...cur)); }
  return path;
}

}

}

function targetFor(a) {
  if (a.state === "meeting") {
    const taken = store.agents.filter(o => o !== a && o.state === "meeting").map(o => key(...o.target));
    return MEETING_SEATS.find(s => !taken.includes(key(...s))) || MEETING_SEATS[0];

    const free = IDLE_SPOTS.filter(s => !taken.includes(key(...s)));
    return free[(a.id.charCodeAt(0) + a.id.length) % free.length] || IDLE_SPOTS[0];
  }
  return a.seat;
}

function mdToHtml(md) {
  const lines = md.split("\n"); let html = "", inList = false, table = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|\s*-/.test(r)).map(r => r.split("|").slice(1, -1).map(c => c.trim()));
    html += `<table><thead><tr>${rows[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    table = [];
  };
  for (const l of lines) {
    if (l.startsWith("|")) { if (inList) { html += "</ul>"; inList = false; } table.push(l); continue; }
    flushTable();
    if (l.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (l.startsWith("## ")) html += `<h5>${inline(l.slice(3))}</h5>`;
    else if (l.startsWith("# ")) html += `<h4>${inline(l.slice(2))}</h4>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  flushTable(); if (inList) html += "</ul>";
  return html;
}

canvas.addEventListener("pointermove", e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!down.moved && Math.hypot(dx, dy) > 5) { down.moved = true; cam.follow = false; canvas.classList.add("dragging"); }
  if (down.moved) { cam.x = down.cx - dx / scale; cam.y = down.cy - dy / scale; }
});
canvas.addEventListener("pointerup", e => {
  const d = down; down = null; canvas.classList.remove("dragging");
  if (!d || d.moved) return;
  const r = canvas.getBoundingClientRect();
  const wx = (e.clientX - r.left - cw / 2) / scale + cam.x, wy = (e.clientY - r.top - ch / 2) / scale + cam.y;
  const hit = [...store.agents, BOSS].filter(a => a._hit && wx >= a._hit.x && wx <= a._hit.x + a._hit.w && wy >= a._hit.y && wy <= a._hit.y + a._hit.h)
    .sort((p, q) => (q.x + q.y) - (p.x + p.y))[0];
  if (hit) { selected = hit.id; renderPanel(true); return; }
  // click the boss desk → approval table
  const tray = iso(26.5, 10.5, 24);
  if (Math.hypot(wx - tray.x, wy - tray.y) < 40) { selected = null; renderPanel(true); return; }
  const g = { x: (wx / (TW / 2) + wy / (TH / 2)) / 2, y: (wy / (TH / 2) - wx / (TW / 2)) / 2 };
  const room = roomOf(Math.floor(g.x), Math.floor(g.y));
  if (room) goRoom(room.id);
});
canvas.addEventListener("keydown", e => {
  const i = ROOMS.findIndex(r => r.id === currentRoom);
  if (e.key === "ArrowRight") goRoom(ROOMS[(i + 1) % ROOMS.length].id);
  if (e.key === "ArrowLeft") goRoom(ROOMS[(i + ROOMS.length - 1) % ROOMS.length].id);
});

/* ------------------------------------------------------------------ boot */
function tickClock() { $("#clock").textContent = `${nowHM()} WIB`; }
tickClock(); setInterval(tickClock, 15000);
renderTabs(); renderTicker(); renderPanel();
setTimeout(() => toast("Raka minta izin: BTC long. Buka Ruang Bos untuk memutuskan."), 900);
</script>
